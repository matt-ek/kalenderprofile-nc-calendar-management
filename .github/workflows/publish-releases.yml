name: Publish Kalenderprofile releases

# Publish from an explicitly created version tag, not on workflow-file edits.
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
    # Path filters do not apply to tag pushes; approval-file changes on main
    # trigger a single explicitly authorized version publication.
    paths:
      - 'docs/releases/*.approved'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v2.0.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kalenderprofile-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'matt-ek/kalenderprofile-nc-calendar-management'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release approval, tag, code version and notes
        env:
          DISPATCH_TAG: ${{ inputs.tag || '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Only an approval marker deliberately added to main can mint a tag.
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="$(sed -nE "s/^[[:space:]]*const VERSION = '([0-9]+\.[0-9]+\.[0-9]+)';/\1/p" src/parts/00-startup.js)"
            test -n "$version"
            RELEASE_TAG="v${version}"
            test -s "docs/releases/${RELEASE_TAG}.approved"
            grep -Fxq 'release-approved: true' "docs/releases/${RELEASE_TAG}.approved"
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          else
            RELEASE_TAG="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected exact SemVer release tag"
            exit 1
          fi
          grep -Fq "const VERSION = '${RELEASE_TAG#v}';" src/parts/00-startup.js
          test -s "docs/releases/${RELEASE_TAG}.md"
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Validated $RELEASE_TAG at $(git rev-parse HEAD)"
      - name: Rebuild and verify standalone artifacts
        run: |
          set -euo pipefail
          python scripts/build.py
          python tests/check_release.py
          git diff --exit-code -- src/calendar-management-generic.js install/bookmarklet-url.txt install/installation.html
      - name: Verify deterministic release package
        run: python tests/test_release_packaging_203.py
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run mandatory browser regression tests
        run: |
          python tests/test_saved_editor_201.py
          python tests/test_caldav_safety_203.py
      - name: Package versioned release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp install/installation.html "dist/kalenderprofile-${RELEASE_TAG}-installation.html"
          # Archive tracks committed bytes and deterministic commit timestamps.
          git archive --format=zip --prefix="kalenderprofile-${RELEASE_TAG}/" HEAD \
            > "dist/kalenderprofile-${RELEASE_TAG}.zip"
          (
            cd dist
            sha256sum "kalenderprofile-${RELEASE_TAG}-installation.html" "kalenderprofile-${RELEASE_TAG}.zip" > SHA256SUMS.txt
            test -s SHA256SUMS.txt
            unzip -tq "kalenderprofile-${RELEASE_TAG}.zip"
            sha256sum --check SHA256SUMS.txt
          )
      - name: Create approved immutable tag after passing all quality gates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Attempt creation first: a missing ref can otherwise yield a "null"
          # jq value that is nonempty and gets mistaken for an existing tag.
          # GitHub rejects POST with HTTP 422 if the ref already exists.
          create_result="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA" --jq '.object.sha' 2>"$RUNNER_TEMP/tag-create-error" || true)"
          if [[ "$create_result" == "$GITHUB_SHA" ]]; then
            echo "Created immutable tag $RELEASE_TAG at $GITHUB_SHA"
          else
            tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            existing="$(gh api "$tag_ref" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$existing" == "$GITHUB_SHA" ]]; then
              echo "Existing immutable tag points to approved commit."
            else
              echo "::error::Tag could not be safely created or verified; no existing ref will be replaced."
              sed -E 's/(token|secret|password)[^[:space:]]*/[REDACTED]/Ig' "$RUNNER_TEMP/tag-create-error" | head -n 8
              exit 1
            fi
          fi
      - name: Publish only if the release is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A retry must not mask partial or differing existing releases.
            temp="$(mktemp -d)"
            if ! gh release download "$RELEASE_TAG" -p SHA256SUMS.txt -D "$temp"; then
              echo "::error::Existing release has no SHA256SUMS.txt; manual recovery required."
              exit 1
            fi
            if ! cmp -s "$temp/SHA256SUMS.txt" dist/SHA256SUMS.txt; then
              echo "::error::Existing release differs from this commit; refusing overwrite."
              exit 1
            fi
            gh release download "$RELEASE_TAG" -p '*.html' -p '*.zip' -D "$temp"
            (cd "$temp" && sha256sum --check SHA256SUMS.txt)
            existing="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
            test "$(echo "$existing" | jq -r '.isDraft')" = "false"
            for asset in "kalenderprofile-${RELEASE_TAG}-installation.html" \
                         "kalenderprofile-${RELEASE_TAG}.zip" "SHA256SUMS.txt"; do
              echo "$existing" | jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .name' >/dev/null
            done
            echo "::notice::Existing release verified; no asset or tag overwritten."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "dist/kalenderprofile-${RELEASE_TAG}-installation.html" \
            "dist/kalenderprofile-${RELEASE_TAG}.zip" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "Kalenderprofile ${RELEASE_TAG#v}" \
            --notes-file "docs/releases/${RELEASE_TAG}.md"
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
          test "$(echo "$release_json" | jq -r '.isDraft')" = "false"
          for asset in "kalenderprofile-${RELEASE_TAG}-installation.html" \
                       "kalenderprofile-${RELEASE_TAG}.zip" "SHA256SUMS.txt"; do
            echo "$release_json" | jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .name' >/dev/null
          done
          published="$(mktemp -d)"
          gh release download "$RELEASE_TAG" -D "$published"
          (cd "$published" && sha256sum --check SHA256SUMS.txt)
          echo "Verified published assets for $RELEASE_TAG"
