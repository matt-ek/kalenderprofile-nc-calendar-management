name: Publish Kalenderprofile releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-releases.yml"

permissions:
  contents: write

jobs:
  publish-releases:
    if: github.repository == 'matt-ek/kalenderprofile-nc-calendar-management'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and validate the bookmarklet
        run: |
          python scripts/build.py
          python tests/check_release.py
          git diff --exit-code -- src/calendar-management-generic.js install/bookmarklet-url.txt install/installation.html
      - name: Publish both releases with retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_release() {
            local version="$1" target="$2" notes="$3"
            if gh release view "$version" >/dev/null 2>&1; then
              echo "$version already exists"
              return 0
            fi
            for attempt in 1 2 3 4 5; do
              if gh release create "$version" --target "$target" --title "Kalenderprofile ${version#v}" --notes-file "$notes"; then
                echo "Release $version created"
                return 0
              fi
              if gh release view "$version" >/dev/null 2>&1; then
                echo "$version was created despite a transient API error"
                return 0
              fi
              echo "Retry $attempt for $version after transient API error"
              sleep $((attempt * 4))
            done
            return 1
          }
          create_release v2.0.0 7a45c48adffc09766a3a3dfcc3d5577e406712c2 docs/releases/v2.0.0.md
          create_release v2.0.1 c1517d75d1b0088005290f35441bb6b15dd3ff37 docs/releases/v2.0.1.md
          if [ "$(gh release view v2.0.1 --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "Publishing the existing 2.0.1 draft after the interrupted asset upload"
            gh release edit v2.0.1 --draft=false --notes-file docs/releases/v2.0.1.md
          fi
          # Publish the actual installable files; GitHub's automatic source archives
          # are not the installer and must not be mistaken for it.
          for version in v2.0.0 v2.0.1; do
            workdir="$(mktemp -d)"
            mkdir -p "$workdir/kalenderprofile-$version"
            git archive "$version" | tar -xf - -C "$workdir/kalenderprofile-$version"
            (
              cd "$workdir/kalenderprofile-$version"
              python scripts/build.py
              python tests/check_release.py
            )
            cp "$workdir/kalenderprofile-$version/install/installation.html" \
              "$workdir/kalenderprofile-$version-installation.html"
            (
              cd "$workdir"
              zip -qr "kalenderprofile-$version.zip" "kalenderprofile-$version"
            )
            gh release upload "$version" \
              "$workdir/kalenderprofile-$version-installation.html" \
              "$workdir/kalenderprofile-$version.zip" --clobber
            gh release view "$version" --json assets --jq '.assets[].name' | \
              grep -Fx "kalenderprofile-$version-installation.html"
            gh release view "$version" --json assets --jq '.assets[].name' | \
              grep -Fx "kalenderprofile-$version.zip"
            notesfile="$workdir/notes.md"
            gh release view "$version" --json body --jq '.body' > "$notesfile"
            if ! grep -q 'Installationsdatei unter Assets' "$notesfile"; then
              printf '\n## Installation\n\nDie **Installationsdatei unter Assets** herunterladen: \`kalenderprofile-%s-installation.html\`. Lokal in Chrome oder Edge öffnen, den Link **Kalenderprofile** in die Lesezeichenleiste ziehen und das Lesezeichen in der Nextcloud-Kalender-App verwenden. Die GitHub-Quellcode-Vorschau ist keine ausführbare Installationsseite.\n' "$version" >> "$notesfile"
              gh release edit "$version" --notes-file "$notesfile"
            fi
            rm -rf "$workdir"
          done
          gh release view v2.0.1 --json isDraft,tagName,url
          test "$(gh release view v2.0.1 --json isDraft --jq '.isDraft')" = "false"
